<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SkillMatch Notification{% endblock %}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 24px 12px;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      max-width: 580px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 28px 24px;
      text-align: center;
    }
    .header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .header p {
      color: #e0e7ff;
      margin: 6px 0 0 0;
      font-size: 13px;
      font-weight: 500;
    }
    .content {
      padding: 32px 28px;
      font-size: 15px;
      line-height: 1.6;
    }
    .content h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 20px;
      color: #0f172a;
    }
    .info-box {
      background-color: #f8fafc;
      border-left: 4px solid #4f46e5;
      padding: 14px 18px;
      margin: 20px 0;
      border-radius: 6px;
      font-size: 14px;
      color: #334155;
    }
    .info-box strong {
      color: #0f172a;
    }
    .btn-container {
      text-align: center;
      margin: 28px 0;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff !important;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }
    .footer {
      background: #f8fafc;
      padding: 18px 24px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid #f1f5f9;
    }
    .footer a {
      color: #6366f1;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>SkillMatch</h1>
      <p>Peer-to-Peer Skill Sharing & Mentorship</p>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p style="margin: 0 0 6px 0;">You received this email because email alerts are enabled on your SkillMatch profile.</p>
      <p style="margin: 0;">You can update your preferences anytime in your <a href="{{ site_url }}/profile">Profile Settings</a>.</p>
    </div>
  </div>
</body>
</html>
